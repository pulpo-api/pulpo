name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: CLI smoke test
        run: |
          cargo run -p pulpo-api-cli -- version
          cargo run -p pulpo-api-cli -- ls examples/jsonplaceholder
          cargo run -p pulpo-api-cli -- fmt examples/jsonplaceholder --check

  codegen:
    name: Generated code and runner
    # The Ubuntu runner already has curl, Node, Python, Go, Java, .NET and PowerShell.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the CLI
        run: cargo build -p pulpo-api-cli

      - name: Run the generated code
        run: PULPO=target/debug/pulpo bash tests/codegen/run.sh

      # The runner and the GitHub Action (actions/run) against the same echo server:
      # data iterations, snapshots and a JSON Schema check.
      - name: Start the echo server for the runner
        run: nohup python3 tests/codegen/echo.py 8765 > /dev/null 2>&1 &

      - name: Run a collection with the Pulpo action
        id: pulpo
        uses: ./actions/run
        with:
          pulpo: target/debug/pulpo
          workspace: tests/runner/workspace
          environment: Local
          data: tests/runner/users.csv
          args: --retries 1
          comment: "false"

      - name: Check the reports
        run: |
          test "${{ steps.pulpo.outputs.passed }}" = "true"
          grep -q 'tests="6" failures="0"' pulpo-reports/junit.xml
          grep -q '<title>Runner check' pulpo-reports/report.html
          grep -q '| 4 | 4 | 0 | 6 | 0 |' pulpo-reports/summary.md

  bundle:
    name: Installers (${{ matrix.os }})
    if: github.event_name == 'push'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build installers
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: pulpo-${{ runner.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        run: |
          missing=$(git log --format='%H %s%n%b' origin/${{ github.base_ref }}..HEAD --no-merges | awk '/^[0-9a-f]{40} /{if(c&&!s)print c; c=$1; s=0; next} /^Signed-off-by:/{s=1} END{if(c&&!s)print c}')
          if [ -n "$missing" ]; then echo "Commits without Signed-off-by:"; echo "$missing"; exit 1; fi
