name: pulpo-dev

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: pulpo-dev
    working_dir: /work
    volumes:
      - ..:/work
      - target:/work/target
      - node_modules:/work/apps/desktop/node_modules
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    environment:
      CARGO_TERM_COLOR: always

volumes:
  target:
  node_modules:
  cargo-registry:
  cargo-git:
