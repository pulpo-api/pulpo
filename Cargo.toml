[workspace]
resolver = "2"
members = ["crates/pulpo-core", "crates/pulpo-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pulpo-api/pulpo"
homepage = "https://pulpo-api.github.io"
authors = ["Pulpo contributors"]
rust-version = "1.80"

[workspace.dependencies]
pulpo-core = { path = "crates/pulpo-core", version = "0.0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
