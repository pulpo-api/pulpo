[package]
name = "pulpo-core"
description = "Core engine of Pulpo: collections, variables and protocol requests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip", "brotli", "deflate"] }
serde_norway = "0.9"
uuid = { version = "1", features = ["v4"] }
rquickjs = "0.14"
keyring = { version = "3.6", optional = true, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }

[features]
keychain = ["dep:keyring"]

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
